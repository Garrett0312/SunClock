<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e15">
<title>Soft Time</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e15'/%3E%3Ccircle cx='32' cy='30' r='13' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e15'/%3E%3Ccircle cx='32' cy='30' r='13' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="manifest" id="manifest-link">
<style>
  :root{
    --bg:#0b0e15;
    --card:#10141d;
    --card-edge:rgba(255,255,255,0.07);
    --gold:#f2c14e;
    --gold-dim:rgba(242,193,78,0.28);
    --teal:#5fc9c0;
    --silver:#c7d0e0;
    --silver-dim:rgba(199,208,224,0.25);
    --ink:#eef1f6;
    --ink-mute:#7c8698;
    --ink-faint:#4c5566;
    --arc:rgba(148,138,110,0.38);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(120% 90% at 50% -10%, #131826 0%, var(--bg) 55%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    padding:24px;
    overflow-x:hidden;
  }
  .app{
    width:100%;
    max-width:420px;
    max-height:calc(100dvh - 48px);
    margin:auto;
    display:flex;
    flex-direction:column;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:20px;
    padding:26px 24px 20px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
    width:100%;
    max-height:100%;
  }
  .toprow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .place{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--ink-mute);
    letter-spacing:0.02em;
    min-width:0;
  }
  .place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-btn{
    background:none;
    border:none;
    color:var(--ink-faint);
    padding:6px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color .15s ease, background .15s ease;
  }
  .icon-btn:hover{color:var(--ink);background:rgba(255,255,255,0.05);}
  .icon-btn svg{width:16px;height:16px;}
  .btn-group{display:flex;gap:2px;}

  .period{
    text-align:center;
    font-size:13px;
    color:var(--teal);
    letter-spacing:0.03em;
    margin:2px 0 4px;
    min-height:18px;
  }

  .arc-wrap{
    position:relative;
    width:100%;
    aspect-ratio:2/1;
    margin-top:6px;
    min-height:0;
  }
  .arc-wrap svg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:visible;
  }
  .arc-clock{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translate(-50%, 0);
    font-size:15px;
    font-weight:650;
    color:var(--ink);
    letter-spacing:0.01em;
    font-variant-numeric:tabular-nums;
    opacity:0.88;
    pointer-events:none;
    white-space:nowrap;
  }

  .times{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    padding-top:16px;
    border-top:1px solid var(--card-edge);
  }
  .time-block{display:flex;flex-direction:column;gap:6px;}
  .time-block.end{align-items:flex-end;}
  .time-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    letter-spacing:0.11em;
    color:var(--teal);
    font-weight:600;
  }
  .time-label svg{width:12px;height:12px;flex-shrink:0;}
  .time-value{
    font-size:26px;
    font-weight:650;
    letter-spacing:0.01em;
    font-variant-numeric:tabular-nums;
  }

  .moonrow{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--card-edge);
  }
  .moon-icon{width:38px;height:38px;flex-shrink:0;}
  .moon-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .moon-phase-name{font-size:14.5px;font-weight:600;color:var(--ink);}
  .moon-sub{font-size:12px;color:var(--ink-mute);}

  .footer{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:16px;
    font-size:11px;
    color:var(--ink-faint);
  }

  /* settings panel */
  .settings{
    position:absolute;
    inset:0;
    background:var(--card);
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 10;
  }
  .settings.open{transform:translateY(0);}
  .settings h2{font-size:15px;margin:0 0 2px;font-weight:650;}
  .settings label{font-size:12px;color:var(--ink-mute);display:block;margin-bottom:6px;}
  .settings input{
    width:100%;
    background:#171c27;
    border:1px solid var(--card-edge);
    color:var(--ink);
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    outline:none;
  }
  .settings input:focus{border-color:var(--teal);}
  .settings-row{display:flex;gap:8px;}
  .settings-row input{flex:1;min-width:0;}
  .settings-actions{display:flex;gap:8px;margin-top:auto;}
  .btn{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:none;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--gold);color:#25200f;}
  .btn-ghost{background:rgba(255,255,255,0.06);color:var(--ink);}
  .suggestions{
    max-height:140px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:-6px;
  }
  .suggestion{
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
    color:var(--ink-mute);
    cursor:pointer;
  }
  .suggestion:hover{background:rgba(255,255,255,0.05);color:var(--ink);}
  .geo-status{font-size:11.5px;color:var(--ink-faint);min-height:14px;}

  @media (max-width:380px){
    .time-value{font-size:22px;}
    .card{padding:20px 18px 16px;}
  }

  /* Horizontal layout for landscape phones, popped-out windows, and desktop */
  @media (min-width:620px){
    body {
      padding: clamp(12px, 3vh, 24px);
    }
    .app { 
      max-width: min(94vw, 1040px);
      height: 100%;
      max-height: calc(100dvh - clamp(24px, 6vh, 48px)); 
    }
    /* Enforce 2:1 initial ratio frame until window/page is resized */
    .app.initial-size {
      /*width: min(92vw, 740px);*/
      width: min(92vw, 1040px);
      aspect-ratio: 2 / 1;
      height: auto;
    }
    .card {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(112px,auto) minmax(260px,1fr) minmax(112px,auto);
      grid-template-rows: auto auto 1fr auto auto;
      grid-template-areas:
        "top    top   top"
        "period period period"
        "sunrise arc  sunset"
        "moon   moon  moon"
        "footer footer footer";
      column-gap: clamp(16px, 3vw, 48px);
      row-gap: clamp(4px, 1vh, 12px);
      padding: clamp(14px, 3vh, 36px) clamp(20px, 4vw, 56px) clamp(12px, 2vh, 28px);
    }
    .toprow{ grid-area:top; margin-bottom:0; }
    .period{ grid-area:period; margin:0; font-size:clamp(12px, 1.4vw, 17px); }
    .arc-wrap {
      grid-area: arc;
      max-width: min(78vw, 860px); 
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      margin: 0 auto;
      align-self: center;
    }
    .arc-clock{ font-size:clamp(14px, 1.8vw, 22px); }
    .times{ display:contents; }
    #sunriseBlock{ grid-area:sunrise; align-self:end; margin-bottom: clamp(4px, 1vh, 12px); }
    #sunsetBlock{ grid-area:sunset; align-self:end; margin-bottom: clamp(4px, 1vh, 12px); }
    .time-value{ font-size:clamp(22px, 3vw, 36px); }
    .moonrow{ 
      grid-area:moon; 
      margin-top:clamp(6px, 1.5vh, 14px); 
      padding-top:clamp(6px, 1.5vh, 14px); 
    }
    .moon-icon{ width:clamp(32px, 3.2vw, 50px); height:clamp(32px, 3.2vw, 50px); }
    .moon-phase-name{ font-size:clamp(13px, 1.5vw, 18px); }
    .footer{ grid-area:footer; margin-top:clamp(4px, 1vh, 10px); }
  }

</style>
</head>
<body>

<div class="app initial-size">
  <div class="card" id="card">

    <div class="toprow">
      <div class="place">
        <span id="placeName">Locating…</span>
      </div>
      <div class="btn-group">
        <button class="icon-btn" id="popoutBtn" title="Open in a small window">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Location settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <div class="period" id="periodLabel">&nbsp;</div>

    <div class="arc-wrap">
      <svg id="arcSvg" viewBox="0 0 300 150" preserveAspectRatio="none"></svg>
      <div class="arc-clock" id="arcClock">–:––</div>
    </div>

    <div class="times">
      <div class="time-block" id="sunriseBlock">
        <div class="time-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Sunrise
        </div>
        <div class="time-value" id="sunriseTime">–:––</div>
      </div>
      <div class="time-block end" id="sunsetBlock">
        <div class="time-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          Sunset
        </div>
        <div class="time-value" id="sunsetTime">–:––</div>
      </div>
    </div>

    <div class="moonrow">
      <svg class="moon-icon" id="moonIcon" viewBox="-20 -20 40 40"></svg>
      <div class="moon-info">
        <div class="moon-phase-name" id="moonPhaseName">Reading the sky…</div>
        <div class="moon-sub" id="moonSub">&nbsp;</div>
      </div>
    </div>

    <div class="footer">
      <span id="updatedAt">&nbsp;</span>
    </div>

    <div class="settings" id="settingsPanel">
      <h2>Location</h2>
      <div>
        <label for="citySearch">Search for a city</label>
        <input type="text" id="citySearch" placeholder="e.g. Cedar Rapids, IA" autocomplete="off">
      </div>
      <div class="suggestions" id="suggestions"></div>
      <div class="settings-row">
        <div style="flex:1">
          <label for="latInput">Latitude</label>
          <input type="text" id="latInput" inputmode="decimal" placeholder="41.98">
        </div>
        <div style="flex:1">
          <label for="lonInput">Longitude</label>
          <input type="text" id="lonInput" inputmode="decimal" placeholder="-91.66">
        </div>
      </div>
      <div class="geo-status" id="geoStatus">&nbsp;</div>
      <div class="settings-actions">
        <button class="btn btn-ghost" id="useGeoBtn">Use my location</button>
        <button class="btn btn-primary" id="saveLocBtn">Save</button>
      </div>
      <button class="btn btn-ghost" id="closeSettingsBtn">Close</button>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- manifest ---------- */
  var manifest = {
    name: "Soft Time",
    short_name: "Soft Time",
    start_url: ".",
    display: "standalone",
    background_color: "#0b0e15",
    theme_color: "#0b0e15",
    icons: [{
      src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e15'/%3E%3Ccircle cx='32' cy='30' r='13' fill='%23f2c14e'/%3E%3C/svg%3E",
      sizes: "64x64",
      type: "image/svg+xml"
    }]
  };
  var manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
  document.getElementById("manifest-link").href = URL.createObjectURL(manifestBlob);

  /* ---------- astronomy helpers ---------- */
  var RAD = Math.PI / 180;
  var J1970 = 2440588, J2000 = 2451545, DAY_MS = 86400000;
  var OBLIQUITY = RAD * 23.4397;

  function toJulian(date){ return date.valueOf() / DAY_MS - 0.5 + J1970; }
  function fromJulian(j){ return new Date((j + 0.5 - J1970) * DAY_MS); }
  function toDays(date){ return toJulian(date) - J2000; }

  function rightAscension(l, b){ return Math.atan2(Math.sin(l) * Math.cos(OBLIQUITY) - Math.tan(b) * Math.sin(OBLIQUITY), Math.cos(l)); }
  function declination(l, b){ return Math.asin(Math.sin(b) * Math.cos(OBLIQUITY) + Math.cos(b) * Math.sin(OBLIQUITY) * Math.sin(l)); }
  function solarMeanAnomaly(d){ return RAD * (357.5291 + 0.98560028 * d); }
  function eclipticLongitude(M){
    var C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    var P = RAD * 102.9372;
    return M + C + P + Math.PI;
  }
  function siderealTime(d, lw){ return RAD * (280.16 + 360.9856235 * d) - lw; }
  function azimuth(H, phi, dec){ return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)); }
  function altitude(H, phi, dec){ return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)); }
  
  function hourAngle(h, phi, dec){
    var cosH = (Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    if (cosH < -1 || cosH > 1) return null; 
    return Math.acos(cosH);
  }
  function sunTimes(date, lat, lng){
    var lw = RAD * -lng, phi = RAD * lat;
    var d = toDays(date);
    var n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
    var ds = 0.0009 + lw / (2 * Math.PI) + n;
    var M = solarMeanAnomaly(ds);
    var L = eclipticLongitude(M);
    var dec = declination(L, 0);
    var Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    var h0 = RAD * -0.833;
    var w0 = hourAngle(h0, phi, dec);
    if (w0 === null){ return { polar: true, alwaysUp: Math.sin(phi) * Math.sin(dec) > 0, solarNoon: fromJulian(Jnoon) }; }
    var Jset = J2000 + (0.0009 + (w0 + lw) / (2 * Math.PI) + n) + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    var Jrise = Jnoon - (Jset - Jnoon);
    return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset), solarNoon: fromJulian(Jnoon), polar: false };
  }

  function moonCoords(d){
    var L = RAD * (218.316 + 13.176396 * d);
    var M = RAD * (134.963 + 13.064993 * d);
    var F = RAD * (93.272 + 13.229350 * d);
    var l = L + RAD * 6.289 * Math.sin(M);
    var b = RAD * 5.128 * Math.sin(F);
    return { ra: rightAscension(l, b), dec: declination(l, b) };
  }
  function moonPosition(date, lat, lng){
    var lw = RAD * -lng, phi = RAD * lat, d = toDays(date);
    var c = moonCoords(d);
    var H = siderealTime(d, lw) - c.ra;
    return { altitude: altitude(H, phi, c.dec), azimuth: azimuth(H, phi, c.dec) };
  }
  function moonEvents(centerDate, lat, lng){
    var stepMin = 8;
    var start = new Date(centerDate.getTime() - 24 * 3600000);
    var steps = Math.floor((72 * 60) / stepMin);
    var events = [];
    var prevAlt = null, prevT = null;
    for (var i = 0; i <= steps; i++){
      var t = new Date(start.getTime() + i * stepMin * 60000);
      var alt = moonPosition(t, lat, lng).altitude;
      if (prevAlt !== null && ((prevAlt < 0) !== (alt < 0))){
        var frac = prevAlt / (prevAlt - alt);
        var crossTime = new Date(prevT.getTime() + frac * (t.getTime() - prevT.getTime()));
        events.push({ time: crossTime, rising: alt > prevAlt });
      }
      prevAlt = alt; prevT = t;
    }
    return events;
  }
  function moonWindowAt(events, now){
    for (var i = 0; i < events.length - 1; i++){
      if (events[i].time <= now && events[i + 1].time >= now){
        return { start: events[i], end: events[i + 1] };
      }
    }
    return null;
  }
  function nextMoonEventLabel(events, now){
    for (var i = 0; i < events.length; i++){
      if (events[i].time > now){ return (events[i].rising ? "Moonrise " : "Moonset ") + fmtTime(events[i].time); }
    }
    return "";
  }

  function moonPhase(date){
    var synodic = 29.530588861;
    var knownNew = Date.UTC(2000, 0, 6, 18, 14);
    var days = (date.getTime() - knownNew) / DAY_MS;
    var phase = (days % synodic) / synodic;
    if (phase < 0) phase += 1;
    return phase;
  }
  function moonPhaseName(phase){
    if (phase < 0.02 || phase > 0.98) return "New Moon";
    if (phase < 0.24) return "Waxing Crescent";
    if (phase < 0.26) return "First Quarter";
    if (phase < 0.49) return "Waxing Gibbous";
    if (phase < 0.51) return "Full Moon";
    if (phase < 0.74) return "Waning Gibbous";
    if (phase < 0.76) return "Last Quarter";
    return "Waning Crescent";
  }
  function moonIllumination(phase){ return (1 - Math.cos(2 * Math.PI * phase)) / 2; }
  function moonSvgPath(phase, r){
    var rx = Math.abs(Math.cos(2 * Math.PI * phase)) * r;
    var sweep1 = (phase % 0.5) < 0.25 ? 1 : 0;
    var sweep2 = phase < 0.5 ? 0 : 1;
    return "M 0 " + (-r) + " A " + rx + " " + r + " 0 0 " + sweep1 + " 0 " + r +
           " A " + r + " " + r + " 0 0 " + sweep2 + " 0 " + (-r) + " Z";
  }
  function renderMoonIcon(phase){
    var r = 17;
    var svg = document.getElementById("moonIcon");
    var lit = moonSvgPath(phase, r);
    svg.innerHTML =
      '<circle cx="0" cy="0" r="' + r + '" fill="none" stroke="var(--silver-dim)" stroke-width="1.2"/>' +
      '<path d="' + lit + '" fill="var(--silver)"/>';
  }

  /* ---------- arc rendering & UI state cache ---------- */
  var CX, CY, Rx, Ry;
  
  var currentDrawState = {
    sunVisible: false, sunT: 0,
    moonVisible: false, moonT: 0, phase: 0
  };

  function arcPoint(t){
    var angle = Math.PI * t;
    return { x: CX - Rx * Math.cos(angle), y: CY - Ry * Math.sin(angle) };
  }

  function resizeArc() {
    var svg = document.getElementById("arcSvg");
    var wrap = document.querySelector(".arc-wrap");
    var w = wrap.clientWidth || 300;
    var h = wrap.clientHeight || 150;
    
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    
    CX = w / 2;
    CY = h - 6; 
    Rx = (w / 2) - 26; 
    Ry = h - 26;       
    
    if (Rx < 1) Rx = 1;
    if (Ry < 1) Ry = 1;

    var path = document.getElementById("baseArcPath");
    if (path) path.setAttribute("d", "M " + (CX - Rx) + " " + CY + " A " + Rx + " " + Ry + " 0 0 1 " + (CX + Rx) + " " + CY);
    
    var horizon = document.getElementById("horizonLine");
    if (horizon) {
      horizon.setAttribute("x1", CX - Rx - 4);
      horizon.setAttribute("x2", CX + Rx + 4);
      horizon.setAttribute("y1", CY);
      horizon.setAttribute("y2", CY);
    }
    
    if (typeof state !== 'undefined' && state.lat != null) {
      updateBodies(currentDrawState.sunVisible, currentDrawState.sunT, currentDrawState.moonVisible, currentDrawState.moonT, currentDrawState.phase);
    }
  }

  function initArcBase(){
    var svg = document.getElementById("arcSvg");
    var ns = "http://www.w3.org/2000/svg";
    
    var path = document.createElementNS(ns, "path");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "var(--arc)");
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("id", "baseArcPath");
    svg.appendChild(path);

    var horizon = document.createElementNS(ns, "line");
    horizon.setAttribute("id", "horizonLine");
    horizon.setAttribute("stroke", "rgba(255,255,255,0.05)");
    horizon.setAttribute("stroke-width", "1");
    svg.appendChild(horizon);

    var defs = document.createElementNS(ns, "defs");
    var sunGrad = document.createElementNS(ns, "radialGradient");
    sunGrad.setAttribute("id", "sunGlowGrad");
    var s1 = document.createElementNS(ns, "stop");
    s1.setAttribute("offset", "0%"); s1.setAttribute("stop-color", "var(--gold)"); s1.setAttribute("stop-opacity", "0.55");
    var s2 = document.createElementNS(ns, "stop");
    s2.setAttribute("offset", "100%"); s2.setAttribute("stop-color", "var(--gold)"); s2.setAttribute("stop-opacity", "0");
    sunGrad.appendChild(s1); sunGrad.appendChild(s2);
    
    var moonGrad = document.createElementNS(ns, "radialGradient");
    moonGrad.setAttribute("id", "moonGlowGrad");
    var m1 = document.createElementNS(ns, "stop");
    m1.setAttribute("offset", "0%"); m1.setAttribute("stop-color", "var(--silver)"); m1.setAttribute("stop-opacity", "0.2");
    var m2 = document.createElementNS(ns, "stop");
    m2.setAttribute("offset", "100%"); m2.setAttribute("stop-color", "var(--silver)"); m2.setAttribute("stop-opacity", "0");
    moonGrad.appendChild(m1); moonGrad.appendChild(m2);
    defs.appendChild(sunGrad); defs.appendChild(moonGrad);
    svg.appendChild(defs);

    var moonGlow = document.createElementNS(ns, "circle");
    moonGlow.setAttribute("id", "moonGlow");
    moonGlow.setAttribute("r", "8");
    moonGlow.setAttribute("fill", "url(#moonGlowGrad)");
    moonGlow.style.display = "none";
    svg.appendChild(moonGlow);

    var moonG = document.createElementNS(ns, "g");
    moonG.setAttribute("id", "moonMark");
    moonG.style.display = "none";
    var moonRing = document.createElementNS(ns, "circle");
    moonRing.setAttribute("r", "5.5");
    moonRing.setAttribute("fill", "none");
    moonRing.setAttribute("stroke", "var(--silver-dim)");
    moonRing.setAttribute("stroke-width", "1");
    var moonLit = document.createElementNS(ns, "path");
    moonLit.setAttribute("id", "moonMarkPath");
    moonLit.setAttribute("fill", "var(--silver)");
    moonG.appendChild(moonRing);
    moonG.appendChild(moonLit);
    svg.appendChild(moonG);

    var sunGlow = document.createElementNS(ns, "circle");
    sunGlow.setAttribute("id", "sunGlow");
    sunGlow.setAttribute("r", "16");
    sunGlow.setAttribute("fill", "url(#sunGlowGrad)");
    sunGlow.style.display = "none";
    svg.appendChild(sunGlow);

    var sunDot = document.createElementNS(ns, "circle");
    sunDot.setAttribute("id", "sunDot");
    sunDot.setAttribute("r", "6.5");
    sunDot.setAttribute("fill", "var(--gold)");
    sunDot.style.display = "none";
    svg.appendChild(sunDot);
    
    resizeArc();
  }

  function setMarker(glowEl, dotEl, visible, t){
    if (!visible){
      glowEl.style.display = "none";
      dotEl.style.display = "none";
      return;
    }
    var p = arcPoint(Math.max(0, Math.min(1, t)));
    glowEl.style.display = "";
    dotEl.style.display = "";
    glowEl.setAttribute("cx", p.x); glowEl.setAttribute("cy", p.y);
    dotEl.setAttribute("cx", p.x); dotEl.setAttribute("cy", p.y);
  }

  function updateBodies(sunVisible, sunT, moonVisible, moonT, moonPhaseVal){
    setMarker(document.getElementById("sunGlow"), document.getElementById("sunDot"), sunVisible, sunT);
    var moonGlow = document.getElementById("moonGlow");
    var moonG = document.getElementById("moonMark");
    var mainMoonIcon = document.getElementById("moonIcon");
    
    if (!moonVisible){
      moonGlow.style.display = "none";
      moonG.style.display = "none";
      if(mainMoonIcon) mainMoonIcon.style.transform = "rotate(0deg)";
      return;
    }
    
    var p = arcPoint(Math.max(0, Math.min(1, moonT)));
    var rot = (moonT - 0.5) * 180;
    
    moonGlow.style.display = "";
    moonG.style.display = "";
    moonGlow.setAttribute("cx", p.x); moonGlow.setAttribute("cy", p.y);
    
    moonG.setAttribute("transform", "translate(" + p.x + "," + p.y + ") rotate(" + rot + ")");
    document.getElementById("moonMarkPath").setAttribute("d", moonSvgPath(moonPhaseVal, 5.5));
    
    if(mainMoonIcon) mainMoonIcon.style.transform = "rotate(" + 5.5 + "deg)";
  }

  /* ---------- formatting ---------- */
  function fmtTime(date){
    if (!date) return "–:––";
    var h = date.getHours(), m = date.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
  }

  function periodLabel(now, times){
    if (!times || times.polar){ return times && times.alwaysUp ? "Sun never sets today" : "Sun stays below the horizon today"; }
    var sunrise = times.sunrise, sunset = times.sunset, noon = times.solarNoon;
    if (now < sunrise){ return (sunrise - now) < 45 * 60000 ? "Early twilight" : "Still night"; }
    if (now >= sunrise && now - sunrise < 60 * 60000) return "Sunrise";
    if (Math.abs(now - noon) < 90 * 60000) return "Midday";
    if (now < noon) return "Morning";
    if (sunset - now < 60 * 60000 && sunset - now > -5*60000) return "Sunset";
    if (now < sunset) return "Afternoon";
    if (now - sunset < 75 * 60000) return "Golden hour fading";
    return "Night";
  }

  function updateClockFace(){
    var el = document.getElementById("arcClock");
    if (el) el.textContent = fmtTime(new Date());
  }

  /* ---------- state / storage ---------- */
  var state = { lat: null, lon: null, place: null };

  function loadState(){
    try {
      var raw = localStorage.getItem("softtime_loc");
      if (raw){
        var s = JSON.parse(raw);
        state.lat = s.lat; state.lon = s.lon; state.place = s.place;
        return true;
      }
    } catch(e){}
    return false;
  }
  function saveState(){
    try { localStorage.setItem("softtime_loc", JSON.stringify(state)); } catch(e){}
  }

  /* ---------- main render ---------- */
  function render(){
    if (state.lat == null || state.lon == null) return;
    var now = new Date();
    var times = sunTimes(now, state.lat, state.lon);

    document.getElementById("sunriseTime").textContent = times.polar ? "—" : fmtTime(times.sunrise);
    document.getElementById("sunsetTime").textContent = times.polar ? "—" : fmtTime(times.sunset);
    document.getElementById("periodLabel").textContent = periodLabel(now, times);

    var sunVisible, sunT;
    if (times.polar){
      sunVisible = !!times.alwaysUp;
      sunT = 0.5;
    } else if (now < times.sunrise || now > times.sunset){
      sunVisible = false;
      sunT = 0;
    } else {
      sunVisible = true;
      sunT = (now - times.sunrise) / (times.sunset - times.sunrise);
    }

    var phase = moonPhase(now);
    renderMoonIcon(phase);
    document.getElementById("moonPhaseName").textContent = moonPhaseName(phase);
    var illum = Math.round(moonIllumination(phase) * 100);

    var mEvents = moonEvents(now, state.lat, state.lon);
    var mWindow = moonWindowAt(mEvents, now);
    var moonVisible, moonT;
    if (mWindow){
      moonVisible = mWindow.start.rising;
      moonT = (now - mWindow.start.time) / (mWindow.end.time - mWindow.start.time);
    } else {
      var curAlt = moonPosition(now, state.lat, state.lon).altitude;
      moonVisible = curAlt > 0;
      moonT = 0.5;
    }
    
    currentDrawState.sunVisible = sunVisible;
    currentDrawState.sunT = sunT;
    currentDrawState.moonVisible = moonVisible;
    currentDrawState.moonT = moonT;
    currentDrawState.phase = phase;

    var nextEvent = nextMoonEventLabel(mEvents, now);
    document.getElementById("moonSub").textContent = illum + "% illuminated" + (nextEvent ? " · " + nextEvent : "");

    updateBodies(sunVisible, sunT, moonVisible, moonT, phase);
    document.getElementById("updatedAt").textContent = "updated " + fmtTime(now);
  }

  /* ---------- geocoding + geolocation ---------- */
  function reverseGeocode(lat, lon){
    fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=en")
      .then(function(r){ return r.json(); })
      .then(function(d){
        var name = d.city || d.locality || "Your location";
        var region = d.principalSubdivisionCode || d.principalSubdivision || "";
        state.place = region ? (name + ", " + region.replace(/^[A-Z]{2}-/, "")) : name;
        document.getElementById("placeName").textContent = state.place;
        saveState();
      })
      .catch(function(){});
  }

  function useGeolocation(){
    var status = document.getElementById("geoStatus");
    if (!navigator.geolocation){
      status.textContent = "Geolocation isn't available in this browser — enter coordinates below.";
      return;
    }
    status.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(function(pos){
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      document.getElementById("latInput").value = state.lat.toFixed(4);
      document.getElementById("lonInput").value = state.lon.toFixed(4);
      status.textContent = "Location found.";
      saveState();
      render();
      reverseGeocode(state.lat, state.lon);
    }, function(err){
      status.textContent = "Couldn't get your location (" + err.message + "). Enter it manually below.";
    }, { enableHighAccuracy:false, timeout:8000 });
  }

  var citySearchTimer = null;
  function citySearch(q){
    var box = document.getElementById("suggestions");
    if (!q || q.length < 2){ box.innerHTML = ""; return; }
    fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&name=" + encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(d){
        box.innerHTML = "";
        (d.results || []).forEach(function(place){
          var row = document.createElement("div");
          row.className = "suggestion";
          var region = place.admin1 ? place.admin1 + ", " : "";
          row.textContent = place.name + ", " + region + place.country;
          row.addEventListener("click", function(){
            state.lat = place.latitude;
            state.lon = place.longitude;
            state.place = place.name + (place.admin1 ? ", " + place.admin1 : "");
            document.getElementById("latInput").value = state.lat.toFixed(4);
            document.getElementById("lonInput").value = state.lon.toFixed(4);
            document.getElementById("placeName").textContent = state.place;
            box.innerHTML = "";
            document.getElementById("citySearch").value = "";
            saveState();
            render();
          });
          box.appendChild(row);
        });
      })
      .catch(function(){});
  }

  /* ---------- wire up UI ---------- */
  function openSettings(){ document.getElementById("settingsPanel").classList.add("open"); }
  function closeSettings(){ document.getElementById("settingsPanel").classList.remove("open"); }

  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);
  document.getElementById("useGeoBtn").addEventListener("click", useGeolocation);
  document.getElementById("saveLocBtn").addEventListener("click", function(){
    var lat = parseFloat(document.getElementById("latInput").value);
    var lon = parseFloat(document.getElementById("lonInput").value);
    if (isNaN(lat) || isNaN(lon)){
      document.getElementById("geoStatus").textContent = "Enter valid numbers for latitude and longitude.";
      return;
    }
    state.lat = lat; state.lon = lon;
    if (!state.place) state.place = lat.toFixed(2) + ", " + lon.toFixed(2);
    document.getElementById("placeName").textContent = state.place;
    saveState();
    render();
    closeSettings();
  });
  document.getElementById("citySearch").addEventListener("input", function(e){
    clearTimeout(citySearchTimer);
    var val = e.target.value;
    citySearchTimer = setTimeout(function(){ citySearch(val); }, 300);
  });
  document.getElementById("popoutBtn").addEventListener("click", function(){
    window.open(location.href, "softtime_popout", "width=740,height=370,menubar=no,toolbar=no,location=no,status=no");
  });

  /* ---------- clear initial-size lock on resize ---------- */
  window.addEventListener("resize", function onFirstResize() {
    var appEl = document.querySelector(".app");
    if (appEl) appEl.classList.remove("initial-size");
    window.removeEventListener("resize", onFirstResize);
  });

  /* ---------- init ---------- */
  initArcBase();
  updateClockFace();
  if (loadState() && state.lat != null){
    document.getElementById("placeName").textContent = state.place || (state.lat.toFixed(2) + ", " + state.lon.toFixed(2));
    document.getElementById("latInput").value = state.lat;
    document.getElementById("lonInput").value = state.lon;
    render();
  } else {
    useGeolocation();
  }

  setInterval(render, 30000);
  setInterval(updateClockFace, 15000);
  
  var resizeObserver = new ResizeObserver(function() {
    window.requestAnimationFrame(resizeArc);
  });
  resizeObserver.observe(document.querySelector(".arc-wrap"));
  
})();
</script>
</body>
</html>
