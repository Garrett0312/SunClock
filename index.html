<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #111;
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: system-ui, sans-serif;
  min-height: 300px;
}
body.bw-active #app-container {
  filter: grayscale(100%);
}

.toolbar {
  position: fixed;
  top: 1.5vh;
  left: 1.5vh;
  z-index: 20;
  display: flex;
  gap: 1vh;
}
.mode-btn {
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.18);
  color: #eee;
  padding: 1.1vh 2vh;
  border-radius: 0.8vh;
  cursor: pointer;
  font-family: system-ui, sans-serif;
  font-size: 1.6vh;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: border-color 0.15s, background 0.15s;
}
.mode-btn:hover { border-color: #5c6ef8; background: rgba(0,0,0,0.7); }

#app-container {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
}

.picker-row {
  flex: 1;
  display: flex;
  min-height: 0;
  transition: background-color 0.1s;
}

.panel-wheel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
}

.panel-controls {
  position: relative;
  flex: 1;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: auto;
  padding: 0; /* Clear outer padding so background colors touch seamlessly */
}

.panel-inner {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1vh;
  padding: 1.5vh 2.5vw;
  width: 100%;
  height: 100%;
}

/* Add a visual separation border between Reference and Sample panels when in compare mode */
#row-a .panel-controls {
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

/* Tighter element scaling for compressed inputs */
.picker-row.compare-active .panel-inner {
  gap: 0.6vh;
  padding: 1vh 2vw;
}
.panel-inner input[type="text"] {
  padding: 0.5vh 1vh;
  font-size: 1.6vh;
}
.panel-inner label {
  font-size: 1.3vh;
}
.color-swatch {
  width: 4.5vh; 
  height: 4.5vh;
}
.section-label {
  font-size: 1.1vh;
  margin-bottom: -0.4vh;
}

.picker-title {
  display: none;
  font-size: 1.4vh;
  font-weight: 700;
  color: #7d8bff;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.picker-row.compare-active .picker-title { display: block; }

/* Tighten vertical spacing in compare mode */
.picker-row.compare-active .panel-controls {
  gap: 1vh;
  padding: 1.5vh 3vw;
}
.picker-row.compare-active input[type="text"],
.picker-row.compare-active .copy-btn {
  padding: 0.6vh 1vh;
  font-size: 1.6vh;
}
.picker-row.compare-active .color-swatch {
  width: 3.8vh;
  height: 3.8vh;
}
.picker-row.compare-active .section-label {
  margin-bottom: -0.6vh;
}

label {
  font-size: 1.8vh;
  font-weight: 600;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
input[type="text"] {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.8vh;
  color: #e8e8e8;
  font-size: 2.2vh;
  padding: 1.2vh 1.5vh;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
  font-family: monospace;
}
input[type="text"]:focus { border-color: #5c6ef8; min-width: 0; }
.input-group { display: flex; flex-direction: column; gap: 0.6vh; min-width: 0; }
.three-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5vh; width: 100%; min-width: 0; }
.color-preview-row { display: flex; align-items: center; gap: 1.5vh; width: 100%; }
.color-swatch {
  width: 6vh; height: 6vh;
  border-radius: 1vh;
  border: 2px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
}
.copy-btn {
  flex: 1;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.8vh;
  color: #ccc;
  font-size: 2.2vh;
  padding: 1.2vh 1.5vh;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  text-align: center;
  font-family: monospace;
}
.copy-btn:hover { background: rgba(255,255,255,0.1); border-color: #5c6ef8; color: #fff; }
.copy-btn.copied { border-color: #4caf6e; color: #4caf6e; }
.section-label {
  font-size: 1.4vh;
  font-weight: 600;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: -1vh;
}

.push-btn {
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.18);
  color: #eee;
  padding: 0.2vh 0.6vh;
  border-radius: 4px;
  cursor: pointer;
  font-family: system-ui, sans-serif;
  font-size: 1.2vh;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: border-color 0.15s, background 0.15s;
}

.push-btn:hover {
  border-color: #5c6ef8;
  background: rgba(0,0,0,0.7);
}

#push-down-btn,
#push-up-btn {
  display: none;
  position: absolute;
  right: 1vh;
  z-index: 4;
}
#push-down-btn {
  bottom: 1vh;
}
#push-up-btn {
  top: 1vh;
}

.deltae-bar {
  display: none;
  flex-direction: column;
  gap: 1vh;
  padding: 1.6vh 3vw;
  background: rgba(0,0,0,0.6);
  border-top: 1px solid rgba(255,255,255,0.15); 
  border-bottom: none;                           
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 5;
}

.deltae-header {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 1.5vh;
  font-family: monospace;
}
.metric-item { display: flex; align-items: baseline; gap: 0.8vh; }
.metric-col { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 0.3vh; 
}
.metric-target { 
  color: #666; 
  font-size: 1.5vh; 
  font-family: monospace; 
  letter-spacing: 0.05em; 
}

.slider-row { display: flex; align-items: center; gap: 1.5vh; width: 100%; }
.slider-row label {
  font-size: 1.2vh;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
  min-width: 14vh;
}
.deltae-title { color: #888; font-size: 1.6vh; text-transform: uppercase; letter-spacing: 0.1em; }
.deltae-value { color: #fff; font-size: 2.6vh; font-weight: 700; }
.deltae-bar input[type="range"] {
  width: 100%;
  accent-color: #5c6ef8;
  cursor: pointer;
}

@media (orientation: portrait) {
  body { height: auto; overflow-y: auto; }
  #app-container { height: auto; }
  .picker-row { flex-direction: column; flex: none; }
  .panel-wheel { flex: none; width: 100%; padding: 4vw 0 0; }
  .panel-controls { flex: none; width: 100%; padding: 4vw 6vw 6vw; gap: 2.5vw; }
}
</style>
</head>
<body>

<div class="toolbar">
  <button class="mode-btn" id="mode-toggle">Compare</button>
  <button class="mode-btn" id="bw-toggle" style="display:none">B&W</button>
</div>

<div id="app-container">
  <div class="picker-row" id="row-a">
    <div class="panel-wheel"><canvas class="wheel-canvas"></canvas></div>
    <div class="panel-controls">
      <div class="panel-inner">
        <div class="picker-title">Reference</div>
        <div class="color-preview-row">
          <div class="color-swatch"></div>
          <button class="copy-btn">#FF0000</button>
        </div>
        <div class="input-group"><label>Hex</label><input type="text" class="hex-input" placeholder="#FF0000" maxlength="8"></div>
        <div class="section-label">RGB</div>
        <div class="three-inputs">
          <div class="input-group"><label>R</label><input type="text" class="r-input" maxlength="3"></div>
          <div class="input-group"><label>G</label><input type="text" class="g-input" maxlength="3"></div>
          <div class="input-group"><label>B</label><input type="text" class="b-input" maxlength="3"></div>
        </div>
        <div class="section-label">HSV</div>
        <div class="three-inputs">
          <div class="input-group"><label>H</label><input type="text" class="h-input" maxlength="3"></div>
          <div class="input-group"><label>S</label><input type="text" class="s-input" maxlength="3"></div>
          <div class="input-group"><label>V</label><input type="text" class="v-input" maxlength="3"></div>
        </div>
        <div class="section-label">HSL</div>
        <div class="three-inputs">
          <div class="input-group"><label>H</label><input type="text" class="h-hsl-input" maxlength="3"></div>
          <div class="input-group"><label>S</label><input type="text" class="s-hsl-input" maxlength="3"></div>
          <div class="input-group"><label>L</label><input type="text" class="l-hsl-input" maxlength="3"></div>
        </div>
      </div>
      <button id="push-down-btn" class="push-btn">PUSH &darr;</button>
    </div>
  </div>

  <div class="picker-row" id="row-b" style="display:none">
    <div class="panel-wheel"><canvas class="wheel-canvas"></canvas></div>
    <div class="panel-controls">
      <button id="push-up-btn" class="push-btn">PUSH &uarr;</button>
      <div class="panel-inner">
        <div class="picker-title">Sample</div>
        <div class="color-preview-row">
          <div class="color-swatch"></div>
          <button class="copy-btn">#FF0000</button>
        </div>
        <div class="input-group"><label>Hex</label><input type="text" class="hex-input" placeholder="#FF0000" maxlength="8"></div>
        <div class="section-label">RGB</div>
        <div class="three-inputs">
          <div class="input-group"><label>R</label><input type="text" class="r-input" maxlength="3"></div>
          <div class="input-group"><label>G</label><input type="text" class="g-input" maxlength="3"></div>
          <div class="input-group"><label>B</label><input type="text" class="b-input" maxlength="3"></div>
        </div>
        <div class="section-label">HSV</div>
        <div class="three-inputs">
          <div class="input-group"><label>H</label><input type="text" class="h-input" maxlength="3"></div>
          <div class="input-group"><label>S</label><input type="text" class="s-input" maxlength="3"></div>
          <div class="input-group"><label>V</label><input type="text" class="v-input" maxlength="3"></div>
        </div>
        <div class="section-label">HSL</div>
        <div class="three-inputs">
          <div class="input-group"><label>H</label><input type="text" class="h-hsl-input" maxlength="3"></div>
          <div class="input-group"><label>S</label><input type="text" class="s-hsl-input" maxlength="3"></div>
          <div class="input-group"><label>L</label><input type="text" class="l-hsl-input" maxlength="3"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="deltae-bar" id="deltae-bar">
    <div class="deltae-header">
      <div class="metric-col">
        <div class="metric-item"><span class="deltae-title">&Delta;E<sub>00</sub></span> <span class="deltae-value" id="deltae-value">0.00</span></div>
        <span class="metric-target">(10-20)</span>
      </div>
      
      <div class="metric-col">
        <div class="metric-item"><span class="deltae-title">&Delta;HUE</span> <span class="deltae-value" id="huediff-value">0.0°</span></div>
        <span class="metric-target">(0&deg;-5&deg;)</span>
      </div>
      
      <div class="metric-col">
        <div class="metric-item"><span class="deltae-title">HSL LIGHTNESS</span> <span class="deltae-value" id="lightdiff-value">+0.0 pp</span></div>
        <span class="metric-target">(&plusmn;10pp - &plusmn;15pp)</span>
      </div>
      
      <div class="metric-col">
        <div class="metric-item"><span class="deltae-title">WCAG CONTRAST</span> <span class="deltae-value" id="contrast-value">1.0:1</span></div>
        <span class="metric-target">(1.5:1 - 2.0:1)</span>
      </div>
      
      <div class="metric-col">
        <div class="metric-item"><span class="deltae-title">&Delta;LUMINANCE</span> <span class="deltae-value" id="rellum-value">0.0%</span></div>
        <span class="metric-target">&nbsp;</span>
      </div>
      
      <div class="metric-col">
        <div class="metric-item">
          <span class="deltae-title" style="font-size: 1.3vh;">BASE LUMINANCE</span> 
          <span class="deltae-value" id="baselum-value" style="font-size: 2vh;">0.0%</span>
        </div>
        <span class="metric-target">&nbsp;</span>
      </div>
    </div>
    <div class="slider-row">
      <label>Hue (H)</label>
      <input type="range" id="hue-slider" min="0" max="360" step="any" value="0">
    </div>
    <div class="slider-row">
      <label>Saturation (S)</label>
      <input type="range" id="sat-slider" min="0" max="100" step="any" value="0">
    </div>
    <div class="slider-row">
      <label>Lightness (L)</label>
      <input type="range" id="lightness-slider" min="0" max="100" step="any" value="0">
    </div>
  </div>
</div>

<script>
const WHEEL_OFFSET = 90; // degrees — change this to rotate the wheel

/* ---------- color math (shared, pure) ---------- */

function hsvToRgb(h, s, v) {
  const i = Math.floor(h / 60) % 6;
  const f = h / 60 - Math.floor(h / 60);
  const p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  const comps = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];
  return { r: Math.round(comps[0]*255), g: Math.round(comps[1]*255), b: Math.round(comps[2]*255) };
}

function rgbToHsv(r, g, b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0, s=max===0?0:d/max, v=max;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h=(h*60); if(h<0) h+=360;
  }
  return { h, s, v };
}

function toHex(r,g,b){ return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function clamp255(v){ return Math.max(0,Math.min(255,Math.round(v))); }

function rgbToXyz(r,g,b){
  let [rl,gl,bl] = [r,g,b].map(v=>{
    v/=255;
    return v>0.04045 ? Math.pow((v+0.055)/1.055,2.4) : v/12.92;
  });
  rl*=100; gl*=100; bl*=100;
  return {
    x: rl*0.4124 + gl*0.3576 + bl*0.1805,
    y: rl*0.2126 + gl*0.7152 + bl*0.0722,
    z: rl*0.0193 + gl*0.1192 + bl*0.9505
  };
}
function xyzToLab(x,y,z){
  const refX=95.047, refY=100.0, refZ=108.883;
  const f = v => v>0.008856 ? Math.cbrt(v) : (7.787*v + 16/116);
  const fx=f(x/refX), fy=f(y/refY), fz=f(z/refZ);
  return { L: (116*fy)-16, a: 500*(fx-fy), b: 200*(fy-fz) };
}
function rgbToLab(r,g,b){ const xyz=rgbToXyz(r,g,b); return xyzToLab(xyz.x,xyz.y,xyz.z); }

function labToXyz(L,a,b){
  const refX=95.047, refY=100.0, refZ=108.883;
  const fy=(L+16)/116, fx=a/500+fy, fz=fy-b/200;
  const inv = t => Math.pow(t,3)>0.008856 ? Math.pow(t,3) : (t-16/116)/7.787;
  return { x: inv(fx)*refX, y: inv(fy)*refY, z: inv(fz)*refZ };
}
function xyzToRgb(x,y,z){
  x/=100; y/=100; z/=100;
  let r = x*3.2406 + y*-1.5372 + z*-0.4986;
  let g = x*-0.9689 + y*1.8758 + z*0.0415;
  let b = x*0.0557 + y*-0.2040 + z*1.0570;
  const gamma = v => v>0.0031308 ? 1.055*Math.pow(v,1/2.4)-0.055 : 12.92*v;
  return { r: clamp255(gamma(r)*255), g: clamp255(gamma(g)*255), b: clamp255(gamma(b)*255) };
}
function labToRgb(L,a,b){ const xyz=labToXyz(L,a,b); return xyzToRgb(xyz.x,xyz.y,xyz.z); }

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l: l * 100 };
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: h * 60, s: s * 100, l: l * 100 };
}

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return { r: clamp255(f(0)*255), g: clamp255(f(8)*255), b: clamp255(f(4)*255) };
}

function hslToHsv(h, s, l) {
  s /= 100; l /= 100;
  const v = l + s * Math.min(l, 1 - l);
  const sv = v === 0 ? 0 : 2 * (1 - l / v);
  return { h: h, s: sv, v: v };
}

// CIEDE2000
function deltaE2000(lab1, lab2) {
  const {L:L1,a:a1,b:b1} = lab1;
  const {L:L2,a:a2,b:b2} = lab2;
  const kL=1,kC=1,kH=1;
  const C1 = Math.sqrt(a1*a1+b1*b1);
  const C2 = Math.sqrt(a2*a2+b2*b2);
  const Cbar = (C1+C2)/2;
  const G = 0.5*(1-Math.sqrt(Math.pow(Cbar,7)/(Math.pow(Cbar,7)+Math.pow(25,7))));
  const a1p = a1*(1+G);
  const a2p = a2*(1+G);
  const C1p = Math.sqrt(a1p*a1p+b1*b1);
  const C2p = Math.sqrt(a2p*a2p+b2*b2);
  const h1p = (Math.atan2(b1,a1p)*180/Math.PI+360)%360;
  const h2p = (Math.atan2(b2,a2p)*180/Math.PI+360)%360;

  const dLp = L2-L1;
  const dCp = C2p-C1p;
  let dhp = 0;
  if (C1p*C2p === 0) dhp = 0;
  else if (Math.abs(h2p-h1p)<=180) dhp = h2p-h1p;
  else if (h2p-h1p>180) dhp = h2p-h1p-360;
  else dhp = h2p-h1p+360;
  const dHp = 2*Math.sqrt(C1p*C2p)*Math.sin((dhp*Math.PI/180)/2);

  const Lbar = (L1+L2)/2;
  const Cbarp = (C1p+C2p)/2;
  let hbarp;
  if (C1p*C2p===0) hbarp = h1p+h2p;
  else if (Math.abs(h1p-h2p)<=180) hbarp = (h1p+h2p)/2;
  else if ((h1p+h2p)<360) hbarp = (h1p+h2p+360)/2;
  else hbarp = (h1p+h2p-360)/2;

  const T = 1 - 0.17*Math.cos((hbarp-30)*Math.PI/180) + 0.24*Math.cos(2*hbarp*Math.PI/180)
              + 0.32*Math.cos((3*hbarp+6)*Math.PI/180) - 0.20*Math.cos((4*hbarp-63)*Math.PI/180);
  const dTheta = 30*Math.exp(-Math.pow((hbarp-275)/25,2));
  const Rc = 2*Math.sqrt(Math.pow(Cbarp,7)/(Math.pow(Cbarp,7)+Math.pow(25,7)));
  const Sl = 1 + (0.015*Math.pow(Lbar-50,2))/Math.sqrt(20+Math.pow(Lbar-50,2));
  const Sc = 1 + 0.045*Cbarp;
  const Sh = 1 + 0.015*Cbarp*T;
  const Rt = -Math.sin(2*dTheta*Math.PI/180)*Rc;

  return Math.sqrt(
    Math.pow(dLp/(kL*Sl),2) +
    Math.pow(dCp/(kC*Sc),2) +
    Math.pow(dHp/(kH*Sh),2) +
    Rt*(dCp/(kC*Sc))*(dHp/(kH*Sh))
  );
}

// WCAG Contrast Ratio Math
function getWcagLuminance(r, g, b) {
  const [rs, gs, bs] = [r, g, b].map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return rs * 0.2126 + gs * 0.7152 + bs * 0.0722;
}

/* ---------- picker factory (one instance = one wheel + one set of inputs) ---------- */

function createPicker(row) {
  const canvas = row.querySelector('.wheel-canvas');
  const ctx = canvas.getContext('2d');
  const wheelPanel = row.querySelector('.panel-wheel');
  const swatch = row.querySelector('.color-swatch');
  const copyBtn = row.querySelector('.copy-btn');
  const hexInput = row.querySelector('.hex-input');
  const rInput = row.querySelector('.r-input');
  const gInput = row.querySelector('.g-input');
  const bInput = row.querySelector('.b-input');
  const hInput = row.querySelector('.h-input');
  const sInput = row.querySelector('.s-input');
  const vInput = row.querySelector('.v-input');
  const hHslInput = row.querySelector('.h-hsl-input');
  const sHslInput = row.querySelector('.s-hsl-input');
  const lHslInput = row.querySelector('.l-hsl-input');

  const state = { hue: 0, sat: 1, val: 0.5 };
  let dragging = null;
  let W, H, cx, cy, outerR, innerR, ringMid, boxSize, boxX, boxY, handleR, boxHandleR;

  const picker = { onChange: null, onUserEdit: null };

  function resize() {
    const isPortrait = window.innerHeight > window.innerWidth;
    let size;
    if (!isPortrait) {
      const rect = wheelPanel.getBoundingClientRect();
      const availW = rect.width || window.innerWidth;
      const availH = rect.height || window.innerHeight;
      size = Math.round(Math.min(availW * 0.85, availH * 0.85));
    } else {
      const compareActive = row.classList.contains('compare-active') && document.getElementById('row-b').style.display !== 'none';
      const heightBudget = window.innerHeight * (compareActive ? 0.30 : 0.52);
      size = Math.round(Math.min(window.innerWidth * 0.9, heightBudget));
    }
    size = Math.max(size, 80);
    canvas.width = size;
    canvas.height = size;
    W = H = size;
    cx = cy = size / 2;
    outerR = Math.round(size * 0.47);
    innerR = Math.round(size * 0.39);
    ringMid = (outerR + innerR) / 2;
    boxSize = Math.floor(innerR * Math.SQRT2 * 0.76);
    boxX = cx - boxSize / 2;
    boxY = cy - boxSize / 2;
    handleR = size * 0.036;
    boxHandleR = size * 0.028;
    draw();
  }

  function drawWheel() {
    const offsetRad = WHEEL_OFFSET * Math.PI / 180;
    for (let i = 0; i < 360; i++) {
      const a1 = (i / 360) * Math.PI * 2 - Math.PI / 2 + offsetRad;
      const a2 = ((i + 1.5) / 360) * Math.PI * 2 - Math.PI / 2 + offsetRad;
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, a1, a2);
      ctx.arc(cx, cy, innerR, a2, a1, true);
      ctx.closePath();
      ctx.fillStyle = `hsl(${360 - i},100%,50%)`;
      ctx.fill();
    }
  }

  function drawBox() {
    const { r, g, b } = hsvToRgb(state.hue, 1, 1);
    const gH = ctx.createLinearGradient(boxX, 0, boxX + boxSize, 0);
    gH.addColorStop(0, '#ffffff');
    gH.addColorStop(1, `rgb(${r},${g},${b})`);
    ctx.fillStyle = gH;
    ctx.fillRect(boxX, boxY, boxSize, boxSize);
    const gV = ctx.createLinearGradient(0, boxY, 0, boxY + boxSize);
    gV.addColorStop(0, 'rgba(0,0,0,0)');
    gV.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = gV;
    ctx.fillRect(boxX, boxY, boxSize, boxSize);
  }

  function drawHandles() {
    const wa = -(state.hue / 360) * Math.PI * 2 - Math.PI / 2 + (WHEEL_OFFSET * Math.PI / 180);
    const wx = cx + ringMid * Math.cos(wa);
    const wy = cy + ringMid * Math.sin(wa);
    ctx.beginPath();
    ctx.arc(wx, wy, handleR, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    const bx = boxX + state.sat * boxSize;
    const by = boxY + (1 - state.val) * boxSize;
    ctx.beginPath();
    ctx.arc(bx, by, boxHandleR, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawWheel();
    drawBox();
    drawHandles();
  }

  function updateInputs() {
    const { r, g, b } = hsvToRgb(state.hue, state.sat, state.val);
    const hex = toHex(r, g, b);
    const hsl = rgbToHsl(r, g, b);
    hexInput.value = hex.toUpperCase();
    rInput.value = r;
    gInput.value = g;
    bInput.value = b;

    hInput.value = Math.round(state.hue);
    sInput.value = Math.round(state.sat * 100);
    vInput.value = Math.round(state.val * 100);
    
    hHslInput.value = Math.round(hsl.h);
    sHslInput.value = Math.round(hsl.s);
    lHslInput.value = Math.round(hsl.l);

    swatch.style.backgroundColor = hex;
    row.style.backgroundColor = hex;
    copyBtn.textContent = hex.toUpperCase();
    copyBtn.classList.remove('copied');
  }

  function setHSV(h, s, v, opts) {
    opts = opts || {};
    state.hue = h; state.sat = s; state.val = v;
    draw();
    updateInputs();
    if (picker.onChange) picker.onChange();
    if (!opts.silent && picker.onUserEdit) picker.onUserEdit();
  }

  function setRGBValues(r, g, b, opts) {
    const hsv = rgbToHsv(r, g, b);
    setHSV(hsv.h, hsv.s, hsv.v, opts);
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * (W / rect.width), y: (src.clientY - rect.top) * (H / rect.height) };
  }
  function inWheel(x, y) {
    const d = Math.hypot(x - cx, y - cy);
    return d >= innerR && d <= outerR;
  }
  function inBox(x, y) {
    return x >= boxX && x <= boxX + boxSize && y >= boxY && y <= boxY + boxSize;
  }
  function handleWheel(x, y) {
    const h = ((Math.atan2(-(y - cy), x - cx) + Math.PI / 2 - (WHEEL_OFFSET * Math.PI / 180)) / (Math.PI * 2) * 360 + 720) % 360;
    setHSV(h, state.sat, state.val);
  }
  function handleBox(x, y) {
    const s = Math.max(0, Math.min(1, (x - boxX) / boxSize));
    const v = Math.max(0, Math.min(1, 1 - (y - boxY) / boxSize));
    setHSV(state.hue, s, v);
  }

  canvas.addEventListener('mousedown', e => {
    const p = getPos(e);
    if (inWheel(p.x, p.y)) { dragging = 'wheel'; handleWheel(p.x, p.y); }
    else if (inBox(p.x, p.y)) { dragging = 'box'; handleBox(p.x, p.y); }
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const p = getPos(e);
    dragging === 'wheel' ? handleWheel(p.x, p.y) : handleBox(p.x, p.y);
  });
  window.addEventListener('mouseup', () => dragging = null);
  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); const p = getPos(e);
    if (inWheel(p.x, p.y)) { dragging = 'wheel'; handleWheel(p.x, p.y); }
    else if (inBox(p.x, p.y)) { dragging = 'box'; handleBox(p.x, p.y); }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault(); if (!dragging) return;
    const p = getPos(e);
    dragging === 'wheel' ? handleWheel(p.x, p.y) : handleBox(p.x, p.y);
  }, { passive: false });
  window.addEventListener('touchend', () => dragging = null);

  hexInput.addEventListener('change', function() {
    if (this.value.length > 7) {
      this.value = this.value.slice(0, 7);
    }
    const v = this.value.trim();
    const hex = v.startsWith('#') ? v : '#' + v;
    if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      setRGBValues(r, g, b);
    }
  });

  hexInput.addEventListener('input', function() {
    if (this.value.includes('#')) {
      this.value = '#' + this.value.replace(/#/g, '');
    }
  });

  function applyRGB() {
    const clamp = (n,mn,mx) => Math.max(mn, Math.min(mx, parseInt(n) || 0));
    setRGBValues(clamp(rInput.value,0,255), clamp(gInput.value,0,255), clamp(bInput.value,0,255));
  }
  function applyHSV() {
    const clamp = (n,mn,mx) => Math.max(mn, Math.min(mx, parseInt(n) || 0));
    setHSV(clamp(hInput.value,0,360), clamp(sInput.value,0,100)/100, clamp(vInput.value,0,100)/100);
  }
  function applyHSL() {
    const clamp = (n,mn,mx) => Math.max(mn, Math.min(mx, parseInt(n) || 0));
    const h = clamp(hHslInput.value, 0, 360);
    const s = clamp(sHslInput.value, 0, 100);
    const l = clamp(lHslInput.value, 0, 100);
    const hsv = hslToHsv(h, s, l);
    setHSV(hsv.h, hsv.s, hsv.v);
  }

  [rInput,gInput,bInput].forEach(el => el.addEventListener('change', applyRGB));
  [hInput,sInput,vInput].forEach(el => el.addEventListener('change', applyHSV));
  [hHslInput, sHslInput, lHslInput].forEach(el => el.addEventListener('change', applyHSL));

  copyBtn.addEventListener('click', function() {
    const hex = hexInput.value.toUpperCase();
    navigator.clipboard.writeText(hex).then(() => {
      this.textContent = 'Copied!'; this.classList.add('copied');
      setTimeout(() => { this.textContent = hex; this.classList.remove('copied'); }, 1500);
    });
  });

  picker.resize = resize;
  picker.getRGB = () => hsvToRgb(state.hue, state.sat, state.val);
  picker.getHex = () => { const {r,g,b} = picker.getRGB(); return toHex(r,g,b); };
  picker.getLab = () => { const {r,g,b} = picker.getRGB(); return rgbToLab(r,g,b); };
  picker.setRGBValues = setRGBValues;
  picker.setHSV = setHSV;

  resize();
  updateInputs();
  return picker;
}

/* ---------- app wiring ---------- */
const huediffValueEl = document.getElementById('huediff-value');
const lightdiffValueEl = document.getElementById('lightdiff-value');
const contrastValueEl = document.getElementById('contrast-value');
const deltaeValueEl = document.getElementById('deltae-value');
const rellumValueEl = document.getElementById('rellum-value');
const baselumValueEl = document.getElementById('baselum-value');

const hueSlider = document.getElementById('hue-slider');
const satSlider = document.getElementById('sat-slider');
const lightnessSlider = document.getElementById('lightness-slider');

const rowA = document.getElementById('row-a');
const rowB = document.getElementById('row-b');
const deltaeBar = document.getElementById('deltae-bar');
const modeBtn = document.getElementById('mode-toggle');
const bwBtn = document.getElementById('bw-toggle');


const pickerA = createPicker(rowA);
const pickerB = createPicker(rowB);

const pushDownBtn = document.getElementById('push-down-btn');
const pushUpBtn = document.getElementById('push-up-btn');

// Target the hex inputs using their existing row containers and classes
const hexA = document.querySelector('#row-a .hex-input'); 
const hexB = document.querySelector('#row-b .hex-input'); 

// Push A down to B
pushDownBtn.addEventListener('click', () => {
  hexB.value = hexA.value;
  // Dispatch 'change' so the color wheel and sliders actually update
  hexB.dispatchEvent(new Event('change')); 
});

// Push B up to A
pushUpBtn.addEventListener('click', () => {
  hexA.value = hexB.value;
  // Dispatch 'change' so the color wheel and sliders actually update
  hexA.dispatchEvent(new Event('change')); 
});


let bwActive = false;
let compareMode = false;
let PushBtn = false;
let sliderDirection = { L: 0, a: 1, b: 0 };
let anchorHSL = { h: 0, s: 0, l: 0 }; 
let isLinked = true; 
let isSyncing = false;

function normalize(v) {
  const mag = Math.sqrt(v.L*v.L + v.a*v.a + v.b*v.b);
  if (mag < 1e-6) return { L: 0, a: 1, b: 0 };
  return { L: v.L/mag, a: v.a/mag, b: v.b/mag };
}

// 2. Add 'updateSliders = true' parameter
function syncDeltaE(updateSliders = true) { 
  const labA = pickerA.getLab();
  const labB = pickerB.getLab();
  const rgbA = pickerA.getRGB();
  const rgbB = pickerB.getRGB();
  const hslA = rgbToHsl(rgbA.r, rgbA.g, rgbA.b);
  const hslB = rgbToHsl(rgbB.r, rgbB.g, rgbB.b);

  // Delta E 2000 Readout
  const dE = deltaE2000(labA, labB);
  deltaeValueEl.textContent = dE.toFixed(2);

  // Hue Difference Readout
  let dh = hslB.h - hslA.h;
  if (dh > 180) dh -= 360;
  if (dh < -180) dh += 360;
  huediffValueEl.textContent = Math.abs(dh).toFixed(1) + '°';

  // HSL Lightness Readout
  const dL = hslB.l - hslA.l;
  lightdiffValueEl.textContent = (dL >= 0 ? '+' : '') + dL.toFixed(1) + ' pp';

  // Update sliders using pure floats (removed .toFixed to prevent rounding loss)
  if (updateSliders) {
    hueSlider.value = hslB.h;
    satSlider.value = hslB.s;
    lightnessSlider.value = hslB.l;
  }

  // Calculate relative luminance for both colors
  const lumA = getWcagLuminance(rgbA.r, rgbA.g, rgbA.b);
  const lumB = getWcagLuminance(rgbB.r, rgbB.g, rgbB.b);

  // Base Luminance Readout (Reference Color)
  baselumValueEl.textContent = (lumA * 100).toFixed(1) + '%';

  // WCAG Contrast Ratio Readout
  const lighter = Math.max(lumA, lumB);
  const darker = Math.min(lumA, lumB);
  const contrast = (lighter + 0.05) / (darker + 0.05);
  contrastValueEl.textContent = contrast.toFixed(1) + ':1';

  // Relative Luminance Difference Readout
  const lumDiff = Math.abs(lumA - lumB) * 100;
  rellumValueEl.textContent = lumDiff.toFixed(1) + '%';
}


bwBtn.addEventListener('click', () => {
  bwActive = !bwActive;
  document.body.classList.toggle('bw-active', bwActive);
  bwBtn.style.borderColor = bwActive ? '#5c6ef8' : '';
  bwBtn.style.color = bwActive ? '#5c6ef8' : '#eee';
  bwBtn.textContent = bwActive ? 'Color' : 'B&W';
});

// 4. Update function to read absolute values directly
function updateSampleFromHslSliders() {
  isLinked = false;
  const targetH = parseFloat(hueSlider.value);
  const targetS = parseFloat(satSlider.value);
  const targetL = parseFloat(lightnessSlider.value);

  const hsv = hslToHsv(targetH, targetS, targetL);
  pickerB.setHSV(hsv.h, hsv.s, hsv.v, { silent: true });

  // Freeze the Sample panel's inputs to match the pure slider math!
  // This prevents the RGB integer-clamping from causing visual jitter in the UI
  rowB.querySelector('.h-hsl-input').value = Math.round(targetH);
  rowB.querySelector('.s-hsl-input').value = Math.round(targetS);
  rowB.querySelector('.l-hsl-input').value = Math.round(targetL);
  
  rowB.querySelector('.h-input').value = Math.round(hsv.h);
  rowB.querySelector('.s-input').value = Math.round(hsv.s * 100);
  rowB.querySelector('.v-input').value = Math.round(hsv.v * 100);

  // Pass FALSE to prevent the 8-bit RGB rounding from altering the sliders while dragging
  syncDeltaE(false); 
}


// 5. Update slider listeners to pull from anchorHSL on double-click
[hueSlider, satSlider, lightnessSlider].forEach(slider => {
  slider.addEventListener('input', updateSampleFromHslSliders);

  slider.addEventListener('dblclick', (e) => {
    if (e.target.id === 'hue-slider') e.target.value = anchorHSL.h;
    if (e.target.id === 'sat-slider') e.target.value = anchorHSL.s;
    if (e.target.id === 'lightness-slider') e.target.value = anchorHSL.l;
    updateSampleFromHslSliders();
  });
});

// 6. Anchor logic for Picker Edits
pickerA.onUserEdit = () => {
  if (compareMode && isLinked) {
    isSyncing = true; // Flag that the code is updating B, not the user
    
    const rgbA = pickerA.getRGB();
    const hslA = rgbToHsl(rgbA.r, rgbA.g, rgbA.b);
    const hsvA = hslToHsv(hslA.h, hslA.s, hslA.l);
    
    // Push color to B and update the slider anchor
    pickerB.setHSV(hsvA.h, hsvA.s, hsvA.v, { silent: true });
    anchorHSL = { h: hslA.h, s: hslA.s, l: hslA.l };
    
    isSyncing = false;
  }
  syncDeltaE(true);
};

pickerB.onUserEdit = () => {
  if (!isSyncing) {
    // If the user manually clicks/types in the bottom panel, break the link!
    isLinked = false; 
    const rgb = pickerB.getRGB();
    anchorHSL = rgbToHsl(rgb.r, rgb.g, rgb.b);
  }
  syncDeltaE(true);
};


modeBtn.addEventListener('click', () => {
  compareMode = !compareMode;
  rowB.style.display = compareMode ? 'flex' : 'none';
  deltaeBar.style.display = compareMode ? 'flex' : 'none';
  bwBtn.style.display = compareMode ? 'block' : 'none';
  pushDownBtn.style.display = compareMode ? 'block' : 'none';
  pushUpBtn.style.display = compareMode ? 'block' : 'none';

  if (!compareMode && bwActive) {
    bwActive = false;

    document.body.classList.remove('bw-active');
    document.body.classList.remove('pushbtn-active');

    bwBtn.style.borderColor = '';
    bwBtn.style.color = '#eee';
    bwBtn.textContent = 'B&W';

  }

  rowA.classList.toggle('compare-active', compareMode);
  rowB.classList.toggle('compare-active', compareMode);
  modeBtn.textContent = compareMode ? 'Standard' : 'Compare';
  
  if (compareMode) {
    isLinked = true; // Restore the link when entering compare mode
    // 1. Grab the current color from the Reference row
    const rgbA = pickerA.getRGB();
    const hslA = rgbToHsl(rgbA.r, rgbA.g, rgbA.b);
    const hsvA = hslToHsv(hslA.h, hslA.s, hslA.l);
    
    // 2. Push it to the Sample row so they start completely identical
    //pickerB.setHSV(hsvA.h, hsvA.s, hsvA.v);
    pickerB.setHSV(hsvA.h, hsvA.s, hsvA.v, { silent: true });
    
    // 3. Set the double-click anchor to this new shared color
    anchorHSL = { h: hslA.h, s: hslA.s, l: hslA.l };
    
    // 4. Force the Delta readouts and sliders to sync
    syncDeltaE(true);
  }
  
  requestAnimationFrame(() => { pickerA.resize(); pickerB.resize(); });
});


window.addEventListener('resize', () => { pickerA.resize(); pickerB.resize(); });
</script>
